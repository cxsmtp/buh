version: "3.8"

services:
  buhome-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buhome-uae
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/courier/serviceability?area=Downtown+Dubai"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
