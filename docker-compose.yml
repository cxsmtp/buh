# Beautiful UAE Home — production on one VPS (Hostinger KVM with the Docker template).
#
#   app    the shop (Next.js), data in the buhome-data volume (database, photos,
#          receipts, backups, audit log). One instance on purpose.
#   caddy  HTTPS with automatic Let's Encrypt certificates, in front of the app.
#
# Start / update with the published image:  docker compose pull app && docker compose up -d
# Or build it here instead:                 docker compose up -d --build
# Logs:            docker compose logs -f app
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Published by .github/workflows/container.yml from main.
    image: ghcr.io/cxsmtp/buh:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/data
      # Caddy sets X-Real-IP; per-address limits use it.
      - TRUST_PROXY=1
    volumes:
      - buhome-data:/data
    # Reachable only through Caddy (no port on the host).
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Let in-flight checkouts finish on update or restart.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  buhome-data:
  caddy-data:
  caddy-config:
