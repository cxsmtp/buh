# Nginx Configuration for Beautiful UAE Home on Hostinger VPS
# Place in: /etc/nginx/sites-available/buhome
# Symlink to: /etc/nginx/sites-enabled/buhome

# Rate limiting zone: max 20 requests per second per IP for API calls
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Access log with the Admin Hub's private link (one 32-character path) and a password-reset
# email's one-time path (43 characters), and a bank-transfer order's private page (/pay/<43>),
# masked to their first 4 characters; no Referer.
map $request_uri $buh_masked_uri {
    "~^(?<pre>/(?:api/)?pay)?/(?<keep>[A-Za-z0-9_-]{4})[A-Za-z0-9_-]{28,}(?<rest>.*)$" "$pre/$keep...$rest";
    default $request_uri;
}
log_format buh_masked '$remote_addr - $remote_user [$time_local] "$request_method $buh_masked_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name yourdomain.ae www.yourdomain.ae;

    # Auto-redirect HTTP to HTTPS (certbot will automate this)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.ae www.yourdomain.ae;

    # Don't advertise the nginx version.
    server_tokens off;
    # Never the full admin link in the log (see buh_masked above). nginx's error log has a fixed
    # format that repeats the request line (an unreachable shop, say), so it keeps only critical
    # messages here; /api/health and the shop's own log show when the shop is down.
    access_log /var/log/nginx/access.log buh_masked;
    error_log /var/log/nginx/error.log crit;
    # Largest legitimate body is a product photo in the admin studio (~6 MB as base64).
    client_max_body_size 10m;
    client_body_timeout 15s;

    # SSL Certificates (managed automatically by Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.ae/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.ae/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression for lightning-fast mobile loading across UAE
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff font/woff2 image/svg+xml;

    # Next.js Static Assets - Long term immutable cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # Admin sign-in and phone codes: much tighter than general API traffic.
    location ~ ^/api/(admin/login|otp/) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints rate protection
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
